<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anna’s Visual Library — Free AI Wallpapers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Free AI-generated wallpapers for mobile. Download and enjoy.">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
      background: #fafafa;
      color: #111;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }
    p {
      max-width: 600px;
      margin-bottom: 24px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
    .support {
      margin-top: 30px;
      margin-bottom: 35px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<h1>Free AI Wallpapers for Mobile</h1>
<p>
Anna’s Open Visual Library — a curated collection of free AI-generated and original wallpapers.
Download freely and enjoy.
</p>
  
<div class="support">
  If you’ve found inspiration here, that truly means a lot to me.<br>
  You can support my work with a coffee ☕
  <a href="https://ko-fi.com/annasvl" target="_blank" rel="noopener">Ko-fi</a>
</div>
  
<div class="gallery" id="gallery"></div>

<script>
fetch('images.json?v=' + Date.now())
  .then(response => response.json())
  .then(images => {
    
     images.reverse();
    
    const gallery = document.getElementById('gallery');

    images.forEach(filename => {
      const link = document.createElement('a');
      link.href = 'images/' + filename;
      link.download = '';

      const img = document.createElement('img');
      img.src = 'images/' + filename;
      img.alt = 'AI mobile wallpaper';

      link.appendChild(img);
      gallery.appendChild(link);
    });
  });
</script>


</body>
</html>
