<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anna’s Visual Library — Free AI Wallpapers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Free AI-generated wallpapers for mobile. Download and enjoy.">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
      background: #fafafa;
      color: #111;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }
    p {
      max-width: 600px;
      margin-bottom: 24px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      
      -webkit-touch-callout: none;
    user-select: none;
      
    }
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background:#eee;          /* плейсхолдер */
      aspect-ratio: 9 / 16;     /* важно: резервируем место */
      object-fit: cover;
    }
    .support {
      margin-top: 30px;
      margin-bottom: 35px;
      font-size: 14px;
      opacity: 0.8;
    }
    .lightbox{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 9999;
}
.lightbox.open{ display: flex; }

.lightbox img{
  max-width: 95vw;
  max-height: 90vh;
  border-radius: 12px;
}

.lightbox .close{
  position: absolute;
  top: 16px;
  right: 16px;
  width: 44px;
  height: 44px;
  border-radius: 999px;
  border: 0;
  background: rgba(255,255,255,.15);
  color: #fff;
  font-size: 28px;
  cursor: pointer;
}

.gallery img{ cursor: zoom-in; }
  </style>
</head>
<body>

<h1>Free AI Wallpapers for Mobile</h1>
<p>
Anna’s Open Visual Library — a curated collection of free AI-generated and original wallpapers.
Download freely and enjoy.
</p>
  
<div class="support">
  If you’ve found inspiration here, that truly means a lot to me.<br>
  You can support my work by buying me a coffee ☕<br>
  <a href="https://ko-fi.com/annasvl" target="_blank" rel="noopener">Ko-fi</a>
  or
  <a href="https://buymeacoffee.com/annasvl" target="_blank" rel="noopener">Buy Me a Coffee</a>
</div>
  
<div class="gallery" id="gallery"></div>

  <div class="lightbox" id="lightbox">
  <button class="close" id="closeBtn" aria-label="Close">×</button>
  <img id="lightboxImg" alt="Wallpaper preview">
</div>


<script>
fetch('images.json?v=' + Date.now())
  .then(r => r.json())
  .then(images => {

    images.reverse(); // последние сверху

    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('closeBtn');
    
const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;

        const img = entry.target;
        const src = img.dataset.src;
        if (!src) return;

        img.src = src;      // старт загрузки
        io.unobserve(img);
      });
    }, { rootMargin: '600px 0px' });
    
    function openPreview(src){
      lightboxImg.src = src;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden'; // важно для мобилы
    }

    function closePreview(){
      lightbox.classList.remove('open');
      lightboxImg.src = '';
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closePreview);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closePreview();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePreview();
    });

    images.forEach(filename => {
  const thumbSrc = 'thumbs/' + filename;
  const fullSrc  = 'images/' + filename;

  const img = document.createElement('img');
  img.dataset.src = thumbSrc;
  img.alt = 'AI mobile wallpaper';
  img.loading = 'lazy';
  img.decoding = 'async';

  io.observe(img);

  let pressTimer = null;
  let longPress = false;

  let startX = 0, startY = 0;
  let moved = false;
  const MOVE_THRESHOLD = 12;

  // TOUCH START
  img.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    moved = false;
    longPress = false;

    pressTimer = setTimeout(() => {
      if (moved) return;
      longPress = true;

      const a = document.createElement('a');
      a.href = fullSrc;           // ⬅️ скачиваем FULL
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 600);
  }, { passive: true });

  // TOUCH MOVE (scroll/swipe)
  img.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    const dx = Math.abs(t.clientX - startX);
    const dy = Math.abs(t.clientY - startY);

    if (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD) {
      moved = true;
      clearTimeout(pressTimer);
    }
  }, { passive: true });

  // TOUCH END
  img.addEventListener('touchend', () => {
    clearTimeout(pressTimer);

    if (longPress) return;
    if (moved) return;

    openPreview(fullSrc); // ⬅️ preview = FULL
  });

  // DESKTOP CLICK
  img.addEventListener('click', () => openPreview(fullSrc));

  gallery.appendChild(img);
});
  });
</script>


</body>
</html>
